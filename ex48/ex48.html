<html>
    <head>
        <title>Thông tin cá nhân</title>
        <style>
            body {
                background-color: #9ac2f7;
                font-family: Times New Roman, serif;
                padding: 20px;
                width: 600px;          
                margin: 0 auto;        
                text-align: center;     
    }
            img {
                width: auto;       
                height: auto;       
                flex-shrink: 0;   
            }
        </style>
    </head>
    <body>
        <img src="hinh/Jackson.gif">
        <h1>Registration Form</h1>
        <p>Register your Jackson Electronics product here</p>
        <form action="" method="post" style="width: 100%;">
            <table>
                <tr>
                    <td>First Name:</td>
                    <td> <input type="text" name ="firstname"> </td>
                    <td>Last Name:</td>
                    <td> <input type="text" name ="lastname"> </td>
                </tr>
                <tr>
                    <td>Address #1:</td>
                    <td> <input type="text" name ="address1"> </td>
                </tr>
                <tr>
                    <td>Address #2:</td>
                    <td> <input type="text" name ="address2"> </td>
                </tr>
                <tr>
                    <td>City:</td>
                    <td> <input type="text" name ="city"> </td>
                    <td>State:</td>
                    <td> <input type="text" name ="state"> </td>
                    <td>Zip:</td>
                    <td> <input type="number" name ="zip"> </td>
                </tr>
                <tr>
                    <td>Country</td>
                    <td> <input type="text" name ="country" value="United States"> </td>
                </tr>
            </table>
            <hr/>
            <table>
                <tr>
                    <td>Product:</td>
                    <td>
                        <select name="product">
                            <option value="ScanMaster" selected>ScanMaster</option>
                            <option value="Product2">Product 2</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Date Purchased:</td>
                    <td> <input type="date" name ="datePurchased"> </td>
                </tr>
                <tr>
                    <td>Serial #:</td>
                    <td> <input type="number" name ="serial"> </td>
                </tr>
                <tr>
                    <td>Used for:</td>
                    <td>
                        <table>
                            <tr>
                                <td><label><input type="radio" name="usedFor" value="Home"> Home</label></td>
                                <td><label><input type="radio" name="usedFor" value="Educational"> Educational Institution</label></td>
                            </tr>
                            <tr>
                                <td><label><input type="radio" name="usedFor" value="Business" checked> Business</label></td>
                                <td><label><input type="radio" name="usedFor" value="Other"> Other</label></td>
                            </tr>
                            <tr>
                                <td colspan="2"><label><input type="radio" name="usedFor" value="Government"> Government</label></td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td>System (check all that apply):</td>
                    <td>
                        <table>
                            <tr>
                                <td><label><input type="checkbox" name="system[]" value="Windows"> Windows</label></td>
                                <td><label><input type="checkbox" name="system[]" value="UNIX"> UNIX</label></td>
                            </tr>
                            <tr>
                                <td><label><input type="checkbox" name="system[]" value="Macintosh"> Macintosh</label></td>
                                <td><label><input type="checkbox" name="system[]" value="Other"> Other</label></td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
            <hr/>
            <table>
                <tr>
                    <td class="label-col" style="vertical-align: top;">Comments?:</td>
                    <td>
                        <textarea name="comments" rows="6" style="width: 100%; resize: none;"></textarea>
                    </td>
                </tr>
            </table>
            <div class="button-group">
                <input type="submit" value="Click to register">
                <input type="reset" value="Click to cancel">
            </div>
        </form>
    </body>
</html>
